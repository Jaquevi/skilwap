[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/skills"
  to = "/.netlify/functions/skills"
  status = 200

[[redirects]]
  from = "/api/proposals"
  to = "/.netlify/functions/proposals"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
